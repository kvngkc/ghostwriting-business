# n8n: runs the weekly drafting job, intake forms and reminders.
# Start: docker compose --env-file ../.env up -d   -> http://localhost:5678
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TIMEZONE:-Africa/Lagos}
      TZ: ${TIMEZONE:-Africa/Lagos}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NODES_EXCLUDE: "[]"
    volumes:
      - n8n_data:/home/node/.n8n
      # Gives n8n's Execute Command node access to the client folders and scripts.
      - ../:/data/automation

volumes:
  n8n_data:
